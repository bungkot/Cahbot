# rag-mvp CI (Sprint 6 KR-5) — gerbang minimum: lint + mypy strict + unit.
# Integration/e2e/eval sekarang jalan di runner GitHub Actions TANPA Docker
# dev container (cf. ci-full.yml — service container pgvector + model
# auto-download & LLM Qwen3-4B); job cepat ini tetap gerbang minimum per-PR.
name: ci

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04 # pin (bukan ubuntu-latest — migrasi 26.10, lihat ci-full.yml)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"

      - name: Sync dependencies (dev)
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check src tests scripts

      - name: Ruff format check
        run: uv run ruff format --check src tests scripts

      - name: mypy strict
        run: uv run mypy src tests

      - name: Unit tests
        run: uv run pytest -m unit -q
