# docker-compose.yml — SATU file untuk dev & prod.
# Arsitektur (topologi) identik di kedua stage:
#   [db pgvector]  ←→  [app runtime]        (+ [dev tooling] pilihan)
# Pilihan hanya lewat profile — TIDAK ada file compose terpisah:
#   dev : docker compose --profile dev up -d       (db + dev tooling; kode di-mount)
#   prod: docker compose --profile prod up -d      (db + app image produksi)
# Nama service & jaringan konsisten: DATABASE_URL selalu @db:5432.
x-db-env: &db-env
  POSTGRES_USER: ${DB_USER:-rag}
  POSTGRES_PASSWORD: ${DB_PASSWORD:-rag}
  POSTGRES_DB: ${DB_NAME:-rag}

services:
  db:
    image: pgvector/pgvector:pg17
    mem_limit: 900m
    shm_size: 256m
    environment: *db-env
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c max_connections=20
      -c max_wal_size=1GB
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ---------- PROD ----------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Arsitektur sama dengan dev: Postgres+pgvector di belakang, app di depan
    mem_limit: 3500m
    profiles: ["prod"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-rag}:${DB_PASSWORD:-rag}@db:5432/${DB_NAME:-rag}
      MODEL_PATH: /models/Qwen3-1.7B-Q3_K_M.gguf
      LLM_THREADS: ${LLM_THREADS:-4}
      HOST: 0.0.0.0
      PORT: 8000
    volumes:
      - ./models:/models:ro
      - ./data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ---------- DEV (tooling + app dev) ----------
  # Topologi sama (db ↔ aplikasi); bedanya hanya tambahan tooling
  # (pytest, Playwright chromium, ruff) dan kode di-mount — TANPA file compose kedua.
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # host 8 GB RAM: 4g terlalu agresif (build EOF saat commit memori penuh)
    mem_limit: 2500m
    profiles: ["dev"]
    working_dir: /workspace
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-rag}:${DB_PASSWORD:-rag}@db:5432/${DB_NAME:-rag}
      DB_HOST: db
      MODEL_PATH: /models/Qwen3-1.7B-Q3_K_M.gguf
      LLM_THREADS: ${LLM_THREADS:-4}
      HOST: 0.0.0.0
      PORT: 8000
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - .:/workspace            # kode di-mount hanya di dev (tidak dibake)
      - ./models:/models:ro     # model tetap bisa dikonsumsi dari dev
      - ./data:/data
    ports:
      - "8000:8000"             # app dev dapat diuji dari host
    command: ["sleep", "infinity"]

volumes:
  pgdata:
    driver: local
